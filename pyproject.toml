[project]
name = "marketpulse-ai"
version = "0.1.0"
description = "Market intelligence from keyless news feeds: share of voice, emerging themes, spikes and cited AI briefings."
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
